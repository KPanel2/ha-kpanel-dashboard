[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components/kpanel_dashboard --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["custom_components/kpanel_dashboard"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
